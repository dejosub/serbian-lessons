<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 3 flash cards</title><style>body{margin:0;background:#17232d;color:#17232d;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.app{width:min(92vw,680px);text-align:center}.card{min-height:360px;background:#fff9ed;border-radius:24px;padding:34px;display:grid;place-items:center;box-shadow:0 16px 45px #0007;cursor:pointer}.prompt{font-size:clamp(28px,6vw,46px)}.answer{font-size:clamp(30px,7vw,52px);font-weight:bold}.latin{display:block;font-size:.55em;font-weight:normal;color:#52616b;margin-top:18px}.hint{color:#fff;margin:16px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}button{font-size:22px;padding:15px;border:0;border-radius:14px;background:#e5b94f;color:#17232d;font-weight:bold}button:disabled{opacity:.4}</style></head><body><main class="app"><div id="card" class="card" role="button" tabindex="0" aria-label="Flash card; tap to flip"><div id="face"></div></div><p class="hint">Tap the card to flip · English first</p><div class="controls"><button id="prev">Prev</button><button id="next">Next</button></div></main><script>
const cards=[['family','породица','porodica'],['mom / mother','мама / мајка','mama / majka'],['dad / father','тата / отац','tata / otac'],['brother','брат','brat'],['sister','сестра','sestra'],['son','син','sin'],['daughter','ћерка','ćerka'],['husband','муж','muž'],['wife; woman','жена','žena'],['boyfriend','дечко','dečko'],['girlfriend','девојка','devojka'],['male / female partner','партнер / партнерка','partner / partnerka'],['Who is this?','Ко је ово?','Ko je ovo?'],['This is ...','Ово је ...','Ovo je ...'],['my (masculine / feminine)','мој / моја','moj / moja'],['I have / don’t have ...','Имам / Немам ...','Imam / Nemam ...'],['love','љубав','ljubav'],['her (masculine / feminine)','њен / њена','njen / njena'],['photograph','фотографија','fotografija'],['looks at','гледа','gleda'],['now','сада','sada'],['old (masculine / feminine)','стар / стара','star / stara'],['grandmother; grandma','бака','baka'],['in the photo','на фотографији','na fotografiji'],['next to','поред','pored'],['lives','живи','živi'],['often','често','često']];
let history=[],pos=-1,current=-1,flipped=false;const face=document.querySelector('#face'),prev=document.querySelector('#prev');function show(){const c=cards[current];face.innerHTML=flipped?`<div class="answer">${c[1]}<span class="latin">${c[2]}</span></div>`:`<div class="prompt">${c[0]}</div>`;prev.disabled=pos<=0}function pick(){if(pos<history.length-1){history=history.slice(0,pos+1)}const recent=history.slice(-10),pool=cards.map((_,i)=>i).filter(i=>!recent.includes(i));const choices=pool.length?pool:cards.map((_,i)=>i).filter(i=>i!==current);current=choices[Math.floor(Math.random()*choices.length)];history.push(current);pos++;flipped=false;show()}function flip(){flipped=!flipped;show()}document.querySelector('#card').onclick=flip;document.querySelector('#card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};document.querySelector('#next').onclick=pick;prev.onclick=()=>{if(pos>0){pos--;current=history[pos];flipped=false;show()}};pick();
</script></body></html>
