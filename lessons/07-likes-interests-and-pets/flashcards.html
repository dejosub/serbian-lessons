<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 7 flash cards</title><style>body{margin:0;background:#17232d;color:#17232d;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.app{width:min(92vw,680px);text-align:center}.card{min-height:360px;background:#fff9ed;border-radius:24px;padding:34px;display:grid;place-items:center;box-shadow:0 16px 45px #0007;cursor:pointer}.prompt{font-size:clamp(28px,6vw,46px)}.answer{font-size:clamp(30px,7vw,52px);font-weight:bold}.latin{display:block;font-size:.55em;font-weight:normal;color:#52616b;margin-top:18px}.hint{color:#fff;margin:16px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}button{font-size:22px;padding:15px;border:0;border-radius:14px;background:#e5b94f;color:#17232d;font-weight:bold}button:disabled{opacity:.4}</style></head><body><main class="app"><div id="card" class="card" role="button" tabindex="0"><div id="face"></div></div><p class="hint">Tap the card to flip · English first</p><div class="controls"><button id="prev">Prev</button><button id="next">Next</button></div></main><script>const cards=[["What do you like?","Шта волиш?","Šta voliš?"],["What do you like doing?","Шта волиш да радиш?","Šta voliš da radiš?"],["I like / do not like","волим / не волим","volim / ne volim"],["I like it","свиђа ми се","sviđa mi se"],["favorite","омиљен / омиљена","omiljen / omiljena"],["because","зато што","zato što"],["interesting","занимљиво","zanimljivo"],["fun","забавно","zabavno"],["it relaxes me","опушта ме","opušta me"],["music","музика","muzika"],["to walk the dog","шетати пса","šetati psa"],["together","заједно","zajedno"]];let history=[],pos=-1,current=-1,flipped=false;const face=document.querySelector('#face'),prev=document.querySelector('#prev');function show(){const c=cards[current];face.innerHTML=flipped?`<div class="answer">${c[1]}<span class="latin">${c[2]}</span></div>`:`<div class="prompt">${c[0]}</div>`;prev.disabled=pos<=0}function pick(){if(pos<history.length-1)history=history.slice(0,pos+1);const recent=history.slice(-10),pool=cards.map((_,i)=>i).filter(i=>!recent.includes(i)),choices=pool.length?pool:cards.map((_,i)=>i).filter(i=>i!==current);current=choices[Math.floor(Math.random()*choices.length)];history.push(current);pos++;flipped=false;show()}document.querySelector('#card').onclick=()=>{flipped=!flipped;show()};document.querySelector('#next').onclick=pick;prev.onclick=()=>{if(pos>0){pos--;current=history[pos];flipped=false;show()}};pick();</script></body></html>
