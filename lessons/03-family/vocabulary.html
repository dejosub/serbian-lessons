<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Lesson 3 cumulative dictionary and flash cards</title><style>
@page{size:letter;margin:.4in}*{box-sizing:border-box}body{margin:0;color:#252342;font-family:Aptos,"Segoe UI",Arial,sans-serif}h1{color:#684596;font:700 27pt Georgia,serif;margin:0 0 6px}.note{color:#716d7e;font-size:9pt}table{width:100%;border-collapse:collapse;font-size:8pt}th{background:#684596;color:#fff;text-align:left}th,td{border:1px solid #cec7d9;padding:3px 5px}tr:nth-child(even)td{background:#f2eff6}.break{break-before:page}.cards{display:grid;grid-template-columns:1fr 1fr;gap:.15in}.card{height:2.25in;border:2px dashed #777286;border-radius:8px;padding:.15in;display:flex;flex-direction:column;justify-content:center;text-align:center;break-inside:avoid}.sr{font:700 18pt Georgia,serif;color:#b03d3b}.cy{font-size:16pt;color:#684596;margin-top:4px}.en{font-size:12.5pt;margin-top:11px}.card small{color:#777286;margin-top:6px}
</style></head><body><h1>Serbian cumulative dictionary</h1><p class="note">After Lesson 3 · Includes all taught vocabulary from Lessons 1–3.</p><table><thead><tr><th>Latin</th><th>Cyrillic</th><th>English / note</th><th>First</th></tr></thead><tbody id="dict"></tbody></table><section class="break"><h1>Lesson 3 flash cards</h1><p class="note">New cards only. Print this set once and add it to Lessons 1–2. Cut on dashed lines.</p><div class="cards" id="cardbox"></div></section><script>
const l1=[['Zdravo!','Здраво!','Hi! / Hello!'],['Dobar dan!','Добар дан!','Hello! / Good afternoon!'],['Ja sam ...','Ја сам ...','I am ...'],['Kako se zoveš / zovete?','Како се зовеш / зовете?','What is your name? informal / polite'],['Drago mi je.','Драго ми је.','Nice to meet you.'],['Da / Ne','Да / Не','Yes / No'],['Učim srpski.','Учим српски.','I’m learning Serbian.'],['Malo.','Мало.','A little.'],['Hvala.','Хвала.','Thank you.'],['Vidimo se!','Видимо се!','See you!'],['kod kuće','код куће','at home'],['dolazi','долази','arrives; is coming'],['kaže','каже','says']];
const l2=[['Kako si / ste?','Како си / сте?','How are you? informal / polite'],['Dobro sam.','Добро сам.','I’m well.'],['Odlično sam.','Одлично сам.','I’m great.'],['Nije loše.','Није лоше.','Not bad.'],['Umorna / Umoran sam.','Уморна / Уморан сам.','I’m tired (female / male).'],['A ti / Vi?','А ти / Ви?','And you? informal / polite'],['I ja.','И ја.','Me too.'],['čaj / ćao','чај / ћао','tea / hi-bye'],['džem','џем','jam'],['gospođa','госпођа','Mrs.; madam'],['kuća','кућа','house; home'],['zove','зове','calls'],['pita','пита','asks'],['ali','али','but']];
const l3=[['porodica','породица','family'],['mama / majka','мама / мајка','mom / mother'],['tata / otac','тата / отац','dad / father'],['brat','брат','brother'],['sestra','сестра','sister'],['sin','син','son'],['ćerka','ћерка','daughter'],['muž','муж','husband'],['žena','жена','wife; woman'],['dečko','дечко','boyfriend'],['devojka','девојка','girlfriend'],['partner / partnerka','партнер / партнерка','male / female partner'],['Ko je ovo?','Ко је ово?','Who is this?'],['Ovo je ...','Ово је ...','This is ...'],['moj / moja','мој / моја','my (masculine / feminine noun)'],['Imam / Nemam ...','Имам / Немам ...','I have / don’t have ...'],['jedan / jedna','један / једна','one (masculine / feminine)'],['ljubav','љубав','love'],['njen / njena','њен / њена','her (masculine / feminine noun)'],['fotografija','фотографија','photograph'],['gleda','гледа','looks at'],['sada','сада','now'],['star / stara','стар / стара','old (masculine / feminine noun)'],['baka','бака','grandmother; grandma'],['na fotografiji','на фотографији','in the photo'],['pored','поред','next to'],['živi','живи','lives'],['često','често','often'],['Niš','Ниш','Niš']];
const extras=[['ja / ti','ја / ти','I / you',1],['učim / učiš','учим / учиш','I learn / you learn',1],['danas','данас','today',2],['Đorđe','Ђорђе','George; sound example',2],['jednog brata / jednu sestru','једног брата / једну сестру','one brother / one sister; useful chunks',3]];const all=[...l1.map(x=>[...x,1]),...l2.map(x=>[...x,2]),...l3.map(x=>[...x,3]),...extras];dict.innerHTML=all.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('');l3.map(x=>[...x,3]).forEach(c=>cardbox.insertAdjacentHTML('beforeend',`<div class="card"><div class="sr">${c[0]}</div><div class="cy">${c[1]}</div><div class="en">${c[2]}</div><small>Lesson ${c[3]}</small></div>`));
</script></body></html>
