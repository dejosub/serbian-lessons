<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 3 flash cards</title><style>body{margin:0;background:#17232d;color:#17232d;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.app{width:min(92vw,680px);text-align:center}.card{min-height:360px;background:#fff9ed;border-radius:24px;padding:34px;display:grid;place-items:center;box-shadow:0 16px 45px #0007;cursor:pointer}.prompt{font-size:clamp(28px,6vw,46px)}.answer{font-size:clamp(30px,7vw,52px);font-weight:bold}.latin{display:block;font-size:.55em;font-weight:normal;color:#52616b;margin-top:18px}.hint{color:#fff;margin:16px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}button{font-size:22px;padding:15px;border:0;border-radius:14px;background:#e5b94f;color:#17232d;font-weight:bold}button:disabled{opacity:.4}</style><style id="star-support-style">main:has(.star-tools){grid-template-rows:auto auto 1fr auto}.star-tools{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:.75rem}.star-tools button{min-height:3.2rem;border:0;border-radius:1rem;padding:.7rem;font:inherit;font-weight:750;background:#e5b94f;color:#17232d}.star-tools button.active{background:#ffe08a}.star-empty{font-size:clamp(1.5rem,6vw,2.5rem)}#card img.star-front-image{max-width:100%;max-height:330px;object-fit:contain}</style></head><body><main class="app"><div class="star-tools"><button id="star-card" type="button">&#9734; Star</button><button id="star-filter" type="button" aria-pressed="false">Starred only (0)</button></div><div id="card" class="card" role="button" tabindex="0" aria-label="Flash card; tap to flip"><div id="face"></div></div><p class="hint">Tap the card to flip · English first</p><p id="status" class="hint" aria-live="polite"></p><div class="controls"><button id="prev">Prev</button><button id="next">Next</button></div></main><script>
const cards=[['family','породица','porodica'],['mom / mother','мама / мајка','mama / majka'],['dad / father','тата / отац','tata / otac'],['brother','брат','brat'],['sister','сестра','sestra'],['son','син','sin'],['daughter','ћерка','ćerka'],['husband','муж','muž'],['wife; woman','жена','žena'],['boyfriend','дечко','dečko'],['girlfriend','девојка','devojka'],['male / female partner','партнер / партнерка','partner / partnerka'],['Who is this?','Ко је ово?','Ko je ovo?'],['This is ...','Ово је ...','Ovo je ...'],['my (masculine / feminine)','мој / моја','moj / moja'],['I have / don’t have ...','Имам / Немам ...','Imam / Nemam ...'],['love','љубав','ljubav'],['her (masculine / feminine)','њен / њена','njen / njena'],['photograph','фотографија','fotografija'],['looks at','гледа','gleda'],['now','сада','sada'],['old (masculine / feminine)','стар / стара','star / stara'],['grandmother; grandma','бака','baka'],['in the photo','на фотографији','na fotografiji'],['next to','поред','pored'],['lives','живи','živi'],['often','често','često']];
let history=[],pos=-1,current=-1,flipped=false;const face=document.querySelector('#face'),prev=document.querySelector('#prev');function show(){const c=cards[current];face.innerHTML=flipped?`<div class="answer">${c[1]}<span class="latin">${c[2]}</span></div>`:`<div class="prompt">${c[0]}</div>`;prev.disabled=pos<=0}function pick(){if(pos<history.length-1){history=history.slice(0,pos+1)}const recent=history.slice(-10),pool=cards.map((_,i)=>i).filter(i=>!recent.includes(i));const choices=pool.length?pool:cards.map((_,i)=>i).filter(i=>i!==current);current=choices[Math.floor(Math.random()*choices.length)];history.push(current);pos++;flipped=false;show()}function flip(){flipped=!flipped;show()}document.querySelector('#card').onclick=flip;document.querySelector('#card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};document.querySelector('#next').onclick=pick;prev.onclick=()=>{if(pos>0){pos--;current=history[pos];flipped=false;show()}};pick();
</script><script id="star-support-script">(()=>{
const lesson='03',key=`serbian-lessons.flashcards.lesson-${lesson}.starred`,deck=cards.map((c,i)=>Array.isArray(c)?{id:(c[0]+'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||`card-${i}`,en:c[0],cy:c[1],la:c[2],image:typeof c[3]==='string'&&c[3].startsWith('data:image/')?c[3]:''}:{id:(c.en+'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||`card-${i}`,en:c.en,cy:c.sr,la:'',image:''});
let stars=new Set,only=false,h=[],p=-1,cur=-1,back=false,storage=true;try{const x=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(x))stars=new Set(x.filter(id=>deck.some(c=>c.id===id)))}catch(e){storage=false}
const cardEl=document.querySelector('#card'),statusEl=document.querySelector('#status'),prevEl=document.querySelector('#prev'),nextEl=document.querySelector('#next'),starEl=document.querySelector('#star-card'),filterEl=document.querySelector('#star-filter');
const available=()=>deck.map((_,i)=>i).filter(i=>!only||stars.has(deck[i].id));function save(){try{localStorage.setItem(key,JSON.stringify([...stars]))}catch(e){storage=false}}
function draw(){filterEl.textContent=`Starred only (${stars.size})`;filterEl.classList.toggle('active',only);filterEl.setAttribute('aria-pressed',String(only));if(cur<0){cardEl.innerHTML='<div class="star-empty">No starred cards yet.</div>';starEl.disabled=prevEl.disabled=nextEl.disabled=true;statusEl.textContent=storage?'Star a card, then return to this view.':'Stars are available for this session only.';return}const c=deck[cur],marked=stars.has(c.id);if(back){cardEl.innerHTML=`<div><div style="font-size:clamp(1.8rem,8vw,3.25rem);font-weight:720">${c.cy}</div>${c.la?`<div style="font-size:1.2rem;margin-top:1rem;color:#62706b">${c.la}</div>`:''}</div>`}else{cardEl.innerHTML=c.image?`<img class="star-front-image" src="${c.image}" alt="">`:`<div style="font-size:clamp(1.8rem,8vw,3.25rem);font-weight:720">${c.en}</div>`}starEl.disabled=false;starEl.textContent=marked?'\u2605 Starred':'\u2606 Star';starEl.classList.toggle('active',marked);prevEl.disabled=p<=0;nextEl.disabled=available().length<2;statusEl.textContent=storage?`Seen ${p+1} \u00b7 ${available().length} cards in this view`:'Stars are available for this session only.'}
function pick(){const a=available();if(!a.length){cur=-1;draw();return}if(p<h.length-1)h=h.slice(0,p+1);const recent=h.slice(-10),pool=a.filter(i=>!recent.includes(i)),choices=pool.length?pool:a.filter(i=>i!==cur),final=choices.length?choices:a;cur=final[Math.floor(Math.random()*final.length)];h.push(cur);p++;back=false;draw()}
function intercept(el,type,fn){el.addEventListener(type,e=>{e.preventDefault();e.stopImmediatePropagation();fn()},true)}intercept(cardEl,'click',()=>{if(cur>=0){back=!back;draw()}});intercept(nextEl,'click',pick);intercept(prevEl,'click',()=>{if(p>0){p--;cur=h[p];back=false;draw()}});intercept(starEl,'click',()=>{if(cur<0)return;const id=deck[cur].id;stars.has(id)?stars.delete(id):stars.add(id);save();if(only&&!stars.has(id)){h=[];p=-1;pick()}else draw()});intercept(filterEl,'click',()=>{only=!only;h=[];p=-1;cur=-1;pick()});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();e.stopImmediatePropagation();(e.key==='ArrowLeft'?prevEl:nextEl).click()}},true);pick();
})();</script></body></html>
