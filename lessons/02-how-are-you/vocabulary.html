<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Lesson 2 cumulative dictionary and flash cards</title><style>
@page{size:letter;margin:.42in}*{box-sizing:border-box}body{margin:0;color:#18332d;font-family:Aptos,"Segoe UI",Arial,sans-serif}h1{color:#a82d27;font:700 27pt Georgia,serif;margin:0 0 7px}.note{color:#60716c;font-size:9.5pt}table{width:100%;border-collapse:collapse;font-size:8.7pt}th{background:#244f45;color:#fff;text-align:left}th,td{border:1px solid #bfcac6;padding:4px 6px}tr:nth-child(even)td{background:#f0f4f1}.break{break-before:page}.cards{display:grid;grid-template-columns:1fr 1fr;gap:.16in}.card{height:2.25in;border:2px dashed #71817d;border-radius:8px;padding:.16in;display:flex;flex-direction:column;justify-content:center;text-align:center;break-inside:avoid}.sr{font:700 19pt Georgia,serif;color:#a82d27}.cy{font-size:16pt;color:#244f45;margin-top:4px}.en{font-size:13pt;margin-top:12px}.card small{color:#71817d;margin-top:7px}
</style></head><body><h1>Serbian cumulative dictionary</h1><p class="note">After Lesson 2 · Includes Lessons 1–2.</p><table><thead><tr><th>Latin</th><th>Cyrillic</th><th>English / note</th><th>First</th></tr></thead><tbody id="dict"></tbody></table><section class="break"><h1>Lesson 2 flash cards</h1><p class="note">New cards only. Print this set once and add it to Lesson 1. Cut on dashed lines.</p><div class="cards" id="cardbox"></div></section><script>
const base=[['Zdravo!','Здраво!','Hi! / Hello!'],['Dobar dan!','Добар дан!','Hello! / Good afternoon!'],['Ja sam ...','Ја сам ...','I am ...'],['Kako se zoveš / zovete?','Како се зовеш / зовете?','What is your name? informal / polite-plural'],['Drago mi je.','Драго ми је.','Nice to meet you.'],['Da / Ne','Да / Не','Yes / No'],['Učim srpski.','Учим српски.','I’m learning Serbian.'],['Malo.','Мало.','A little.'],['Hvala.','Хвала.','Thank you.'],['Vidimo se!','Видимо се!','See you!'],['kod kuće','код куће','at home'],['dolazi','долази','arrives; is coming'],['kaže','каже','says']];
const added=[['Kako si / ste?','Како си / сте?','How are you? informal / polite-plural'],['Dobro sam.','Добро сам.','I’m well.'],['Odlično sam.','Одлично сам.','I’m great.'],['Nije loše.','Није лоше.','Not bad.'],['Umorna / Umoran sam.','Уморна / Уморан сам.','I’m tired (female / male).'],['A ti / Vi?','А ти / Ви?','And you? informal / polite'],['I ja.','И ја.','Me too.'],['čaj / ćao','чај / ћао','tea / hi-bye'],['džem','џем','jam'],['gospođa','госпођа','Mrs.; madam'],['kuća','кућа','house; home'],['zove','зове','calls'],['pita','пита','asks'],['ali','али','but']];
const rows=[...base.map(x=>[...x,1]),...added.map(x=>[...x,2]),['danas','данас','today',2],['Đorđe','Ђорђе','George; sound example',2],['ste','сте','are (polite/plural)',2],['Vi','Ви','you (polite/plural)',2]];dict.innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('');added.map(x=>[...x,2]).forEach(c=>cardbox.insertAdjacentHTML('beforeend',`<div class="card"><div class="sr">${c[0]}</div><div class="cy">${c[1]}</div><div class="en">${c[2]}</div><small>Lesson ${c[3]}</small></div>`));
</script></body></html>
