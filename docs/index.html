<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Serbian lesson flash cards</title>
  <style>
    :root { color-scheme: light; --ink:#18332d; --paper:#fffdf7; --red:#a82d27; --green:#244f45; --gold:#d5a62e; }
    * { box-sizing:border-box; }
    body { margin:0; background:#e4ece8; color:var(--ink); font-family:Aptos,"Segoe UI",Arial,sans-serif; }
    main { width:min(58rem,92vw); margin:0 auto; padding:3rem 0 5rem; }
    header { background:var(--paper); border-top:.65rem solid var(--red); border-radius:1rem; padding:2rem; box-shadow:0 .5rem 1.7rem #18332d1d; }
    h1 { margin:0 0 .7rem; color:var(--red); font:700 clamp(2rem,6vw,3.5rem)/1.05 Georgia,serif; }
    header p { margin:0; font-size:1.1rem; line-height:1.5; }
    #lessons { display:grid; gap:1rem; margin-top:1.4rem; }
    article { background:var(--paper); border-radius:1rem; padding:1.25rem 1.4rem; box-shadow:0 .35rem 1.2rem #18332d14; }
    article h2 { margin:0 0 1rem; font-size:1.35rem; }
    .number { color:var(--red); margin-right:.45rem; }
    .links { display:flex; flex-wrap:wrap; gap:.7rem; }
    a { display:inline-block; padding:.72rem 1rem; border-radius:.65rem; color:white; background:var(--green); font-weight:700; text-decoration:none; }
    a:hover, a:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
    #error { color:#8a1f1f; font-weight:700; }
  </style>
</head>
<body><main>
  <header><h1>Serbian flash cards</h1><p>Choose a lesson to study its new cards.</p></header>
  <p id="error" role="alert"></p><section id="lessons" aria-label="Lessons"></section>
  <noscript>JavaScript is required for the lesson directory. Individual flash-card pages continue to work locally.</noscript>
</main><script>
fetch('./flashcards/lessons.json').then(response => {
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  return response.json();
}).then(lessons => {
  document.querySelector('#lessons').innerHTML = lessons.map(lesson => `
    <article>
      <h2><span class="number">Lesson ${lesson.number}</span>${lesson.title}</h2>
      <div class="links">
        <a href="./flashcards/lesson-${lesson.number}/">Study flash cards</a>
      </div>
    </article>`).join('');
}).catch(error => {
  document.querySelector('#error').textContent = `Could not load the lesson list: ${error.message}`;
});
  </script></body>
</html>
