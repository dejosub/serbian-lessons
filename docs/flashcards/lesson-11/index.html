<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 11 flash cards</title><style>body{margin:0;background:#252b34;color:#222b35;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.app{width:min(92vw,680px);text-align:center}.card{min-height:360px;background:#fff8f1;border-radius:24px;padding:34px;display:grid;place-items:center;box-shadow:0 16px 45px #0007;cursor:pointer}.prompt{font-size:clamp(28px,6vw,46px)}.answer{font-size:clamp(30px,7vw,52px);font-weight:bold}.latin{display:block;font-size:.55em;font-weight:normal;color:#52616b;margin-top:18px}.hint,.status{color:#fff;margin:12px}.status{min-height:1.2em;font-size:14px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}.study{margin-bottom:14px}button{font-size:22px;padding:15px;border:0;border-radius:14px;background:#dda84b;color:#222b35;font-weight:bold}button:disabled{opacity:.4}.starred{background:#ffe08a}.swatch{width:min(70vw,320px);height:220px;border-radius:20px;border:3px solid #0003}</style></head><body><main class="app"><div class="controls study"><button id="star">☆ Star</button><button id="filter" aria-pressed="false">Starred only (0)</button></div><div id="card" class="card" role="button" tabindex="0"><div id="face"></div></div><p class="hint">Tap the card to flip · English first</p><p id="status" class="status" aria-live="polite"></p><div class="controls"><button id="prev">Prev</button><button id="next">Next</button></div></main><script>const cards=[["red", "red", "црвен / црвена / црвено", "crven / crvena / crveno", "#c62828"], ["blue", "blue", "плав / плава / плаво", "plav / plava / plavo", "#1e5aa8"], ["green", "green", "зелен / зелена / зелено", "zelen / zelena / zeleno", "#2e7d32"], ["yellow", "yellow", "жут / жута / жуто", "žut / žuta / žuto", "#f2c200"], ["white", "white", "бео / бела / бело", "beo / bela / belo", "#ffffff"], ["black", "black", "црн / црна / црно", "crn / crna / crno", "#1b1b1b"], ["gray", "gray", "сив / сива / сиво", "siv / siva / sivo", "#8a8f94"], ["brown", "brown", "браон", "braon", "#7b4a26"], ["pink", "pink", "розе", "roze", "#f48fb1"], ["purple", "purple", "љубичаст / љубичаста / љубичасто", "ljubičast / ljubičasta / ljubičasto", "#7b3fa0"], ["orange", "orange", "наранџаст / наранџаста / наранџасто", "narandžast / narandžasta / narandžasto", "#f07c00"], ["color", "color", "боја", "boja"], ["what-color-is-it", "What color is it?", "Које је боје?", "Koje je boje?"], ["what-is-your-favorite-color", "What is your favorite color?", "Која ти је омиљена боја?", "Koja ti je omiljena boja?"], ["light-blue-dark-green", "light blue / dark green", "светлоплав / тамнозелен", "svetloplav / tamnozelen"], ["clothes", "clothes", "одећа", "odeća"], ["t-shirt", "T-shirt", "мајица", "majica"], ["jacket", "jacket", "јакна", "jakna"], ["dress", "dress", "хаљина", "haljina"], ["what-are-you-wearing-i-m-wearing", "What are you wearing? / I’m wearing ...", "Шта носиш? / Носим ...", "Šta nosiš? / Nosim ..."], ["what-should-i-wear", "What should I wear?", "Шта да носим?", "Šta da nosim?"], ["it-suits-you", "It suits you!", "Пристаје ти!", "Pristaje ti!"], ["do-you-have-in-blue-polite", "Do you have ... in blue? (polite)", "Имате ли ... у плавој боји?", "Imate li ... u plavoj boji?"], ["can-i-try-it-on", "Can I try it on?", "Могу ли да пробам?", "Mogu li da probam?"], ["can-you-eat-it", "Can you eat it?", "Да ли се једе?", "Da li se jede?"], ["sky-river", "sky / river", "небо / река", "nebo / reka"], ["again", "again", "опет", "opet"]];const storageKey='serbian-lessons.flashcards.lesson-11.starred';let history=[],pos=-1,current=-1,flipped=false,starredOnly=false,storageOk=true,stars=new Set;const face=document.querySelector('#face'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),star=document.querySelector('#star'),filter=document.querySelector('#filter'),status=document.querySelector('#status');try{const saved=JSON.parse(localStorage.getItem(storageKey)||'[]');if(Array.isArray(saved))stars=new Set(saved.filter(id=>cards.some(c=>c[0]===id)))}catch(e){storageOk=false}function eligible(){return cards.map((_,i)=>i).filter(i=>!starredOnly||stars.has(cards[i][0]))}function save(){try{localStorage.setItem(storageKey,JSON.stringify([...stars]))}catch(e){storageOk=false}}function show(){filter.textContent=`Starred only (${stars.size})`;filter.setAttribute('aria-pressed',String(starredOnly));filter.classList.toggle('starred',starredOnly);if(current<0){face.innerHTML='<div class="prompt">No starred cards yet.</div>';star.disabled=prev.disabled=next.disabled=true;status.textContent=storageOk?'Star a card, then return to this view.':'Stars are available for this session only.';return}const c=cards[current],isStarred=stars.has(c[0]);face.innerHTML=flipped?`<div class="answer">${c[2]}<span class="latin">${c[3]}</span></div>`:(c[4]?`<div class="swatch" style="background:${c[4]}" aria-hidden="true"></div>`:`<div class="prompt">${c[1]}</div>`);star.disabled=false;star.textContent=isStarred?'★ Starred':'☆ Star';star.classList.toggle('starred',isStarred);prev.disabled=pos<=0;next.disabled=eligible().length<2;status.textContent=storageOk?'':'Stars are available for this session only.'}function pick(){const available=eligible();if(!available.length){current=-1;show();return}if(pos<history.length-1)history=history.slice(0,pos+1);const recent=history.slice(-10),pool=available.filter(i=>!recent.includes(i)),choices=pool.length?pool:available.filter(i=>i!==current),finalChoices=choices.length?choices:available;current=finalChoices[Math.floor(Math.random()*finalChoices.length)];history.push(current);pos++;flipped=false;show()}function flip(){if(current>=0){flipped=!flipped;show()}}document.querySelector('#card').onclick=flip;document.querySelector('#card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};next.onclick=pick;prev.onclick=()=>{if(pos>0){pos--;current=history[pos];flipped=false;show()}};star.onclick=()=>{if(current<0)return;const id=cards[current][0];stars.has(id)?stars.delete(id):stars.add(id);save();if(starredOnly&&!stars.has(id)){history=[];pos=-1;pick()}else show()};filter.onclick=()=>{starredOnly=!starredOnly;history=[];pos=-1;current=-1;pick()};pick();</script></body></html>
