<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Азбука — Serbian alphabet flash cards</title><style>:root{color-scheme:light;--ink:#1d2c35;--paper:#fffaf0;--blue:#315d86;--gold:#e2ad3d}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#17232d;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center}.app{width:min(96vw,900px);padding:20px 0;text-align:center}h1{color:#fff;margin:0 0 14px}.tools,.nav{display:grid;gap:12px}.tools{grid-template-columns:repeat(3,1fr);margin-bottom:12px}.nav{grid-template-columns:1fr 1fr}button{border:0;border-radius:14px;padding:14px;font:700 17px system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--gold);color:var(--ink)}button:disabled{opacity:.45}.active{background:#ffe28a}.card{min-height:620px;border-radius:24px;background:var(--paper);box-shadow:0 16px 45px #0007;padding:16px;display:grid;place-items:center;cursor:pointer;margin-bottom:10px}#face{width:100%}.front{font:700 clamp(70px,20vw,140px)/1.1 Georgia,serif}.answer{width:100%;display:grid;justify-items:center;gap:10px}.picture{width:50%;aspect-ratio:1.5;background-image:var(--sheet);background-size:300% 200%;background-position:var(--x) var(--y);background-repeat:no-repeat;border-radius:16px;border:3px solid #e4dfd2}.word{font-size:clamp(28px,7vw,42px);font-weight:700}.word small{display:block;font-size:.62em;color:#52616b;margin-top:5px}.hint,.status{color:#fff;margin:9px;min-height:1.2em}.status{font-size:14px}@media(max-width:600px){.tools{grid-template-columns:1fr 1fr}.tools #mode{grid-column:1/-1}.card{min-height:500px;padding:8px}}@media(max-height:720px) and (min-width:601px){.card{min-height:520px}}</style></head><body><main class="app"><h1>Азбука</h1><div class="tools"><button id="star">☆ Star</button><button id="filter" aria-pressed="false">Starred only (0)</button><button id="mode" aria-pressed="false">Order: Alphabetical</button></div><div id="card" class="card" role="button" tabindex="0" aria-label="Alphabet flash card; tap to flip"><div id="face"></div></div><p class="hint">Tap the card to flip · Cyrillic first</p><p id="status" class="status" aria-live="polite"></p><div class="nav"><button id="prev">Prev</button><button id="next">Next</button></div></main><script>
const cards=[
['a','А а','A a','авион','avion',1,0],['b','Б б','B b','бундева','bundeva',1,1],['v','В в','V v','воз','voz',1,2],['g','Г г','G g','гитара','gitara',1,3],['d','Д д','D d','дрво','drvo',1,4],['dj','Ђ ђ','Đ đ','ђак','đak',1,5],
['e','Е е','E e','екран','ekran',2,0],['zh','Ж ж','Ž ž','жаба','žaba',2,1],['z','З з','Z z','зец','zec',2,2],['i','И и','I i','игла','igla',2,3],['j','Ј ј','J j','јабука','jabuka',2,4],['k','К к','K k','књига','knjiga',2,5],
['l','Л л','L l','лопта','lopta',3,0],['lj','Љ љ','Lj lj','љуљашка','ljuljaška',3,1],['m','М м','M m','мачка','mačka',3,2],['n','Н н','N n','наочаре','naočare',3,3],['nj','Њ њ','Nj nj','њива','njiva',3,4],['o','О о','O o','оловка','olovka',3,5],
['p','П п','P p','пас','pas',4,0],['r','Р р','R r','риба','riba',4,1],['s','С с','S s','сунце','sunce',4,2],['t','Т т','T t','торба','torba',4,3],['cj','Ћ ћ','Ć ć','ћебе','ćebe',4,4],['u','У у','U u','уво','uvo',4,5],
['f','Ф ф','F f','флаша','flaša',5,0],['h','Х х','H h','хлеб','hleb',5,1],['c','Ц ц','C c','цвет','cvet',5,2],['ch','Ч ч','Č č','чаша','čaša',5,3],['dzh','Џ џ','Dž dž','џем','džem',5,4],['sh','Ш ш','Š š','шешир','šešir',5,5]
];
const positions=[['0%','0%'],['50%','0%'],['100%','0%'],['0%','100%'],['50%','100%'],['100%','100%']],key='serbian-lessons.flashcards.azbuka.starred';let stars=new Set,only=false,randomMode=false,history=[],pos=-1,current=-1,flipped=false,storageOk=true;const face=document.querySelector('#face'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),star=document.querySelector('#star'),filter=document.querySelector('#filter'),mode=document.querySelector('#mode'),status=document.querySelector('#status');try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))stars=new Set(saved.filter(id=>cards.some(c=>c[0]===id)))}catch(e){storageOk=false}function available(){return cards.map((_,i)=>i).filter(i=>!only||stars.has(cards[i][0]))}function save(){try{localStorage.setItem(key,JSON.stringify([...stars]))}catch(e){storageOk=false}}function draw(){filter.textContent=`Starred only (${stars.size})`;filter.classList.toggle('active',only);filter.setAttribute('aria-pressed',String(only));mode.textContent=randomMode?'Order: Random':'Order: Alphabetical';mode.classList.toggle('active',randomMode);mode.setAttribute('aria-pressed',String(randomMode));if(current<0){face.innerHTML='<div class="front">No starred cards yet.</div>';star.disabled=prev.disabled=next.disabled=true;status.textContent=storageOk?'Star a letter, then return to this view.':'Stars are available for this session only.';return}const c=cards[current],marked=stars.has(c[0]),xy=positions[c[6]];face.innerHTML=flipped?`<div class="answer"><div class="picture" role="img" aria-label="${c[4]}" style="--sheet:url('assets/azbuka-0${c[5]}.png');--x:${xy[0]};--y:${xy[1]}"></div><div class="word">${c[3]}<small>${c[4]}</small></div></div>`:`<div class="front">${c[1]}</div>`;star.disabled=false;star.textContent=marked?'★ Starred':'☆ Star';star.classList.toggle('active',marked);prev.disabled=pos<=0;next.disabled=available().length<2;status.textContent=storageOk?`${available().length} letters · ${randomMode?'random':'alphabetical'} order`:'Stars are available for this session only.'}function pick(){const a=available();if(!a.length){current=-1;draw();return}if(pos<history.length-1)history=history.slice(0,pos+1);if(randomMode){const recent=history.slice(-10),pool=a.filter(i=>!recent.includes(i)),choices=pool.length?pool:a.filter(i=>i!==current),final=choices.length?choices:a;current=final[Math.floor(Math.random()*final.length)]}else{const at=a.indexOf(current);current=a[(at+1)%a.length]}history.push(current);pos++;flipped=false;draw()}function flip(){if(current>=0){flipped=!flipped;draw()}}document.querySelector('#card').onclick=flip;document.querySelector('#card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};next.onclick=pick;prev.onclick=()=>{if(pos>0){pos--;current=history[pos];flipped=false;draw()}};star.onclick=()=>{if(current<0)return;const id=cards[current][0];stars.has(id)?stars.delete(id):stars.add(id);save();if(only&&!stars.has(id)){history=[];pos=-1;current=-1;pick()}else draw()};filter.onclick=()=>{only=!only;history=[];pos=-1;current=-1;pick()};mode.onclick=()=>{randomMode=!randomMode;history=[];pos=-1;current=-1;pick()};pick();
</script></body></html>
