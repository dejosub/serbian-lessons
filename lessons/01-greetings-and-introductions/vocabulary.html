<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Lesson 1 cumulative dictionary and flash cards</title><style>
@page{size:letter;margin:.45in}*{box-sizing:border-box}body{margin:0;color:#18332d;font-family:Aptos,"Segoe UI",Arial,sans-serif}h1{color:#a82d27;font:700 28pt Georgia,serif;margin:0 0 8px}h2{color:#244f45;font:700 20pt Georgia,serif;border-bottom:3px solid #d5a62e;padding-bottom:5px}.note{color:#60716c;font-size:10pt}table{width:100%;border-collapse:collapse;font-size:10pt}th{background:#244f45;color:#fff;text-align:left}th,td{border:1px solid #bfcac6;padding:5px 7px}tr:nth-child(even)td{background:#f0f4f1}.break{break-before:page}.cards{display:grid;grid-template-columns:1fr 1fr;gap:.18in}.card{height:2.25in;border:2px dashed #71817d;border-radius:8px;padding:.18in;display:flex;flex-direction:column;justify-content:center;text-align:center;break-inside:avoid}.sr{font:700 21pt Georgia,serif;color:#a82d27}.cy{font-size:17pt;color:#244f45;margin-top:5px}.en{font-size:14pt;margin-top:14px}.tag{position:absolute}.card small{color:#71817d;margin-top:9px}
</style></head><body><h1>Serbian cumulative dictionary</h1><p class="note">After Lesson 1 · Serbian is shown in Latin and Cyrillic.</p><table><thead><tr><th>Latin</th><th>Cyrillic</th><th>English / note</th></tr></thead><tbody id="dict"></tbody></table><section class="break"><h1>Lesson 1 flash cards</h1><p class="note">New cards only. Print this set once. Cut on dashed lines and fold if you want to hide the English prompt.</p><div class="cards" id="cards"></div></section><script>
const rows=[['a','а','and; but; “and you?”'],['da','да','yes'],['dobar dan','добар дан','hello; good afternoon'],['drago mi je','драго ми је','nice to meet you'],['hvala','хвала','thank you'],['ja','ја','I'],['ja sam','ја сам','I am'],['kako','како','how'],['Kako se zoveš?','Како се зовеш?','What is your name? (informal)'],['Kako se zovete?','Како се зовете?','What is your name? (polite/plural)'],['malo','мало','a little'],['ne','не','no; not'],['sam','сам','am'],['se','се','reflexive particle'],['si','си','are (informal singular)'],['srpski','српски','Serbian'],['ti','ти','you (informal singular)'],['učim / učiš','учим / учиш','I learn / you learn'],['Vidimo se!','Видимо се!','See you!'],['Zdravo!','Здраво!','Hi! / Hello!']];
const cards=[['Zdravo!','Здраво!','Hi! / Hello!'],['Dobar dan!','Добар дан!','Hello! / Good afternoon!'],['Ja sam ...','Ја сам ...','I am ...'],['Kako se zoveš?','Како се зовеш?','What is your name? (informal)'],['Kako se zovete?','Како се зовете?','What is your name? (polite/plural)'],['Drago mi je.','Драго ми је.','Nice to meet you.'],['Da / Ne','Да / Не','Yes / No'],['Učim srpski.','Учим српски.','I’m learning Serbian.'],['Malo.','Мало.','A little.'],['Hvala.','Хвала.','Thank you.'],['Vidimo se!','Видимо се!','See you!'],['ja / ti','ја / ти','I / you (informal)'],['sam / si','сам / си','am / are']];
dict.innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('');cards.forEach(c=>document.querySelector('#cards').insertAdjacentHTML('beforeend',`<div class="card"><div class="sr">${c[0]}</div><div class="cy">${c[1]}</div><div class="en">${c[2]}</div><small>Lesson 1</small></div>`));
</script></body></html>
