<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#e7edf3">
  <title>Lesson 02 Flash Cards</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; } * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: #e7edf3; color: #263340; display: grid; place-items: center; }
    main { width: min(100%, 34rem); min-height: 100svh; padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left)); display: grid; grid-template-rows: auto 1fr auto; gap: 1rem; }
    header { text-align: center; } h1 { margin: 0; font-size: clamp(1.3rem, 6vw, 2rem); } #status { margin: .35rem 0 0; color: #65717d; font-size: .9rem; }
    #card { width: 100%; min-height: 18rem; border: 0; border-radius: 1.5rem; padding: 2rem 1.3rem; background: #fff; color: inherit; box-shadow: 0 .5rem 1.8rem #26334026; cursor: pointer; touch-action: manipulation; display: grid; align-content: center; gap: 1rem; }
    #card:focus-visible, .nav:focus-visible { outline: .25rem solid #28658a; outline-offset: .2rem; } #side { color: #a14d35; font-size: .78rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    #text { font-size: clamp(1.8rem, 8vw, 3.25rem); font-weight: 720; line-height: 1.17; overflow-wrap: anywhere; } #hint { color: #71808a; font-size: .88rem; }
    nav { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; } .nav { min-height: 3.5rem; border: 0; border-radius: 1rem; font: inherit; font-size: 1.05rem; font-weight: 750; cursor: pointer; touch-action: manipulation; }
    #prev { background: #d5dce2; color: #263340; } #next { background: #28658a; color: white; } #prev:disabled { opacity: .42; cursor: default; }
  </style>
<style id="star-support-style">main:has(.star-tools){grid-template-rows:auto auto 1fr auto}.star-tools{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:.75rem}.star-tools button{min-height:3.2rem;border:0;border-radius:1rem;padding:.7rem;font:inherit;font-weight:750;background:#e5b94f;color:#17232d}.star-tools button.active{background:#ffe08a}.star-empty{font-size:clamp(1.5rem,6vw,2.5rem)}#card img.star-front-image{max-width:100%;max-height:330px;object-fit:contain}</style></head>
<body><main>
  <header><h1>Lesson 02 Flash Cards</h1><p id="status" aria-live="polite"></p></header>
  <div class="star-tools"><button id="star-card" type="button">&#9734; Star</button><button id="star-filter" type="button" aria-pressed="false">Starred only (0)</button></div><button id="card" type="button" aria-label="Flash card. Tap to show Serbian."><span id="side">English</span><span id="text"></span><span id="hint">Tap the card to flip</span></button>
  <nav aria-label="Card navigation"><button class="nav" id="prev" type="button">← Prev</button><button class="nav" id="next" type="button">Next →</button></nav>
</main><script>
  const cards = [
    { en: "How are you? (informal)", sr: "Kako si? · Како си?" }, { en: "How are you? (polite/plural)", sr: "Kako ste? · Како сте?" },
    { en: "I’m well.", sr: "Dobro sam. · Добро сам." }, { en: "I’m great.", sr: "Odlično sam. · Одлично сам." },
    { en: "Not bad.", sr: "Nije loše. · Није лоше." }, { en: "I’m tired (female / male).", sr: "Umorna / Umoran sam. · Уморна / Уморан сам." },
    { en: "And you? informal / polite", sr: "A ti? / A Vi? · А ти? / А Ви?" }, { en: "Me too.", sr: "I ja. · И ја." },
    { en: "tea", sr: "čaj · чај" }, { en: "hi / bye", sr: "ćao · ћао" }, { en: "jam", sr: "džem · џем" },
    { en: "Mrs.; madam", sr: "gospođa · госпођа" }, { en: "house; home", sr: "kuća · кућа" },
    { en: "calls", sr: "zove · зове" }, { en: "asks", sr: "pita · пита" }, { en: "but", sr: "ali · али" }
  ];
  const history = [Math.floor(Math.random() * cards.length)]; let position = 0; let serbian = false;
  const card = document.querySelector("#card"), text = document.querySelector("#text"), side = document.querySelector("#side"), status = document.querySelector("#status"), prev = document.querySelector("#prev"), next = document.querySelector("#next");
  function render() { const item = cards[history[position]]; side.textContent = serbian ? "Serbian" : "English"; text.textContent = serbian ? item.sr : item.en; status.textContent = `Seen ${position + 1} · ${cards.length} cards in this lesson`; prev.disabled = position === 0; card.setAttribute("aria-label", `Flash card, ${side.textContent} side. Tap to flip.`); }
  card.addEventListener("click", () => { serbian = !serbian; render(); }); prev.addEventListener("click", () => { if (position > 0) { position--; serbian = false; render(); } });
  next.addEventListener("click", () => { const recent = new Set(history.slice(Math.max(0, position - 9), position + 1)); const choices = cards.map((_, index) => index).filter(index => !recent.has(index)); const pick = choices[Math.floor(Math.random() * choices.length)]; history.splice(position + 1); history.push(pick); position++; serbian = false; render(); });
  document.addEventListener("keydown", event => { if (event.key === "ArrowLeft") prev.click(); if (event.key === "ArrowRight") next.click(); }); render();
</script><script id="star-support-script">(()=>{
const lesson='02',key=`serbian-lessons.flashcards.lesson-${lesson}.starred`,deck=cards.map((c,i)=>Array.isArray(c)?{id:(c[0]+'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||`card-${i}`,en:c[0],cy:c[1],la:c[2],image:typeof c[3]==='string'&&c[3].startsWith('data:image/')?c[3]:''}:{id:(c.en+'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||`card-${i}`,en:c.en,cy:c.sr,la:'',image:''});
let stars=new Set,only=false,h=[],p=-1,cur=-1,back=false,storage=true;try{const x=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(x))stars=new Set(x.filter(id=>deck.some(c=>c.id===id)))}catch(e){storage=false}
const cardEl=document.querySelector('#card'),statusEl=document.querySelector('#status'),prevEl=document.querySelector('#prev'),nextEl=document.querySelector('#next'),starEl=document.querySelector('#star-card'),filterEl=document.querySelector('#star-filter');
const available=()=>deck.map((_,i)=>i).filter(i=>!only||stars.has(deck[i].id));function save(){try{localStorage.setItem(key,JSON.stringify([...stars]))}catch(e){storage=false}}
function draw(){filterEl.textContent=`Starred only (${stars.size})`;filterEl.classList.toggle('active',only);filterEl.setAttribute('aria-pressed',String(only));if(cur<0){cardEl.innerHTML='<div class="star-empty">No starred cards yet.</div>';starEl.disabled=prevEl.disabled=nextEl.disabled=true;statusEl.textContent=storage?'Star a card, then return to this view.':'Stars are available for this session only.';return}const c=deck[cur],marked=stars.has(c.id);if(back){cardEl.innerHTML=`<div><div style="font-size:clamp(1.8rem,8vw,3.25rem);font-weight:720">${c.cy}</div>${c.la?`<div style="font-size:1.2rem;margin-top:1rem;color:#62706b">${c.la}</div>`:''}</div>`}else{cardEl.innerHTML=c.image?`<img class="star-front-image" src="${c.image}" alt="">`:`<div style="font-size:clamp(1.8rem,8vw,3.25rem);font-weight:720">${c.en}</div>`}starEl.disabled=false;starEl.textContent=marked?'\u2605 Starred':'\u2606 Star';starEl.classList.toggle('active',marked);prevEl.disabled=p<=0;nextEl.disabled=available().length<2;statusEl.textContent=storage?`Seen ${p+1} \u00b7 ${available().length} cards in this view`:'Stars are available for this session only.'}
function pick(){const a=available();if(!a.length){cur=-1;draw();return}if(p<h.length-1)h=h.slice(0,p+1);const recent=h.slice(-10),pool=a.filter(i=>!recent.includes(i)),choices=pool.length?pool:a.filter(i=>i!==cur),final=choices.length?choices:a;cur=final[Math.floor(Math.random()*final.length)];h.push(cur);p++;back=false;draw()}
function intercept(el,type,fn){el.addEventListener(type,e=>{e.preventDefault();e.stopImmediatePropagation();fn()},true)}intercept(cardEl,'click',()=>{if(cur>=0){back=!back;draw()}});intercept(nextEl,'click',pick);intercept(prevEl,'click',()=>{if(p>0){p--;cur=h[p];back=false;draw()}});intercept(starEl,'click',()=>{if(cur<0)return;const id=deck[cur].id;stars.has(id)?stars.delete(id):stars.add(id);save();if(only&&!stars.has(id)){h=[];p=-1;pick()}else draw()});intercept(filterEl,'click',()=>{only=!only;h=[];p=-1;cur=-1;pick()});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();e.stopImmediatePropagation();(e.key==='ArrowLeft'?prevEl:nextEl).click()}},true);pick();
})();</script></body></html>
