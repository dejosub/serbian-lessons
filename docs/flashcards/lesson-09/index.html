<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 9 flash cards</title><style>body{margin:0;background:#252b34;color:#222b35;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.app{width:min(92vw,680px);text-align:center}.card{min-height:360px;background:#fff8f1;border-radius:24px;padding:34px;display:grid;place-items:center;box-shadow:0 16px 45px #0007;cursor:pointer}.prompt{font-size:clamp(28px,6vw,46px)}.answer{font-size:clamp(30px,7vw,52px);font-weight:bold}.latin{display:block;font-size:.55em;font-weight:normal;color:#52616b;margin-top:18px}.hint,.status{color:#fff;margin:12px}.status{min-height:1.2em;font-size:14px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}.study{margin-bottom:14px}button{font-size:22px;padding:15px;border:0;border-radius:14px;background:#dda84b;color:#222b35;font-weight:bold}button:disabled{opacity:.4}.starred{background:#ffe08a}</style></head><body><main class="app"><div class="controls study"><button id="star">☆ Star</button><button id="filter" aria-pressed="false">Starred only (0)</button></div><div id="card" class="card" role="button" tabindex="0"><div id="face"></div></div><p class="hint">Tap the card to flip · English first</p><p id="status" class="status" aria-live="polite"></p><div class="controls"><button id="prev">Prev</button><button id="next">Next</button></div></main><script>const cards=[["0", "0", "нула", "nula"], ["2", "2", "два / две", "dva / dve"], ["3", "3", "три", "tri"], ["4", "4", "четири", "četiri"], ["5", "5", "пет", "pet"], ["6", "6", "шест", "šest"], ["7", "7", "седам", "sedam"], ["8", "8", "осам", "osam"], ["9", "9", "девет", "devet"], ["10", "10", "десет", "deset"], ["11-12-19", "11, 12 ... 19", "једанаест, дванаест ... деветнаест", "jedanaest, dvanaest ... devetnaest"], ["20-30-40-50", "20 / 30 / 40 / 50", "двадесет / тридесет / четрдесет / педесет", "dvadeset / trideset / četrdeset / pedeset"], ["60-70-80-90", "60 / 70 / 80 / 90", "шездесет / седамдесет / осамдесет / деведесет", "šezdeset / sedamdeset / osamdeset / devedeset"], ["100-200-300", "100 / 200 / 300", "сто / двеста / триста", "sto / dvesta / trista"], ["1000", "1000", "хиљада", "hiljada"], ["how-much-how-many", "How much? / How many?", "Колико?", "Koliko?"], ["how-much-does-it-do-they-cost", "How much does it / do they cost?", "Колико кошта? / Колико коштају?", "Koliko košta? / Koliko koštaju?"], ["how-much-is-that", "How much is that?", "Колико је то?", "Koliko je to?"], ["how-old-are-you", "How old are you?", "Колико имаш година?", "Koliko imaš godina?"], ["i-am-thirty-years-old", "I am thirty years old.", "Имам тридесет година.", "Imam trideset godina."], ["how-many-brothers-and-sisters-do-you-have", "How many brothers and sisters do you have?", "Колико имаш браће и сестара?", "Koliko imaš braće i sestara?"], ["what-is-your-phone-number", "What is your phone number?", "Који је твој број телефона?", "Koji je tvoj broj telefona?"], ["can-you-repeat-that-polite", "Can you repeat that? (polite)", "Можете ли да поновите?", "Možete li da ponovite?"], ["open-air-market", "open-air market", "пијаца", "pijaca"], ["seller-female", "seller (female)", "продавачица", "prodavačica"], ["apple", "apple", "јабука", "jabuka"], ["half-a-kilo", "half a kilo", "пола кила", "pola kila"], ["give-me-please", "Give me ..., please.", "Дајте ми ..., молим.", "Dajte mi ..., molim."], ["anything-else", "Anything else?", "Још нешто?", "Još nešto?"], ["that-s-all", "That’s all.", "То је све.", "To je sve."], ["expensive-cheap", "expensive / cheap", "скупо / јефтино", "skupo / jeftino"], ["you-speak-serbian-well", "You speak Serbian well!", "Лепо говорите српски!", "Lepo govorite srpski!"], ["thanks-i-m-still-learning", "Thanks, I’m still learning.", "Хвала, још учим.", "Hvala, još učim."]];const storageKey='serbian-lessons.flashcards.lesson-09.starred';let history=[],pos=-1,current=-1,flipped=false,starredOnly=false,storageOk=true,stars=new Set;const face=document.querySelector('#face'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),star=document.querySelector('#star'),filter=document.querySelector('#filter'),status=document.querySelector('#status');try{const saved=JSON.parse(localStorage.getItem(storageKey)||'[]');if(Array.isArray(saved))stars=new Set(saved.filter(id=>cards.some(c=>c[0]===id)))}catch(e){storageOk=false}function eligible(){return cards.map((_,i)=>i).filter(i=>!starredOnly||stars.has(cards[i][0]))}function save(){try{localStorage.setItem(storageKey,JSON.stringify([...stars]))}catch(e){storageOk=false}}function show(){filter.textContent=`Starred only (${stars.size})`;filter.setAttribute('aria-pressed',String(starredOnly));filter.classList.toggle('starred',starredOnly);if(current<0){face.innerHTML='<div class="prompt">No starred cards yet.</div>';star.disabled=prev.disabled=next.disabled=true;status.textContent=storageOk?'Star a card, then return to this view.':'Stars are available for this session only.';return}const c=cards[current],isStarred=stars.has(c[0]);face.innerHTML=flipped?`<div class="answer">${c[2]}<span class="latin">${c[3]}</span></div>`:`<div class="prompt">${c[1]}</div>`;star.disabled=false;star.textContent=isStarred?'★ Starred':'☆ Star';star.classList.toggle('starred',isStarred);prev.disabled=pos<=0;next.disabled=eligible().length<2;status.textContent=storageOk?'':'Stars are available for this session only.'}function pick(){const available=eligible();if(!available.length){current=-1;show();return}if(pos<history.length-1)history=history.slice(0,pos+1);const recent=history.slice(-10),pool=available.filter(i=>!recent.includes(i)),choices=pool.length?pool:available.filter(i=>i!==current),finalChoices=choices.length?choices:available;current=finalChoices[Math.floor(Math.random()*finalChoices.length)];history.push(current);pos++;flipped=false;show()}function flip(){if(current>=0){flipped=!flipped;show()}}document.querySelector('#card').onclick=flip;document.querySelector('#card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};next.onclick=pick;prev.onclick=()=>{if(pos>0){pos--;current=history[pos];flipped=false;show()}};star.onclick=()=>{if(current<0)return;const id=cards[current][0];stars.has(id)?stars.delete(id):stars.add(id);save();if(starredOnly&&!stars.has(id)){history=[];pos=-1;pick()}else show()};filter.onclick=()=>{starredOnly=!starredOnly;history=[];pos=-1;current=-1;pick()};pick();</script></body></html>
