<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#e9efe5">
  <title>Lesson 03 Flash Cards</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; } * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: #e9efe5; color: #26372c; display: grid; place-items: center; }
    main { width: min(100%, 34rem); min-height: 100svh; padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left)); display: grid; grid-template-rows: auto 1fr auto; gap: 1rem; }
    header { text-align: center; } h1 { margin: 0; font-size: clamp(1.3rem, 6vw, 2rem); } #status { margin: .35rem 0 0; color: #647268; font-size: .9rem; }
    #card { width: 100%; min-height: 18rem; border: 0; border-radius: 1.5rem; padding: 2rem 1.3rem; background: #fff; color: inherit; box-shadow: 0 .5rem 1.8rem #26372c26; cursor: pointer; touch-action: manipulation; display: grid; align-content: center; gap: 1rem; }
    #card:focus-visible, .nav:focus-visible { outline: .25rem solid #497b4f; outline-offset: .2rem; } #side { color: #9d513a; font-size: .78rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    #text { font-size: clamp(1.8rem, 8vw, 3.25rem); font-weight: 720; line-height: 1.17; overflow-wrap: anywhere; } #hint { color: #718078; font-size: .88rem; }
    nav { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; } .nav { min-height: 3.5rem; border: 0; border-radius: 1rem; font: inherit; font-size: 1.05rem; font-weight: 750; cursor: pointer; touch-action: manipulation; }
    #prev { background: #d6ddd2; color: #26372c; } #next { background: #497b4f; color: white; } #prev:disabled { opacity: .42; cursor: default; }
  </style>
</head>
<body><main>
  <header><h1>Lesson 03 Flash Cards</h1><p id="status" aria-live="polite"></p></header>
  <button id="card" type="button" aria-label="Flash card. Tap to show Serbian."><span id="side">English</span><span id="text"></span><span id="hint">Tap the card to flip</span></button>
  <nav aria-label="Card navigation"><button class="nav" id="prev" type="button">← Prev</button><button class="nav" id="next" type="button">Next →</button></nav>
</main><script>
  const cards = [
    { en: "family", sr: "porodica · породица" }, { en: "mom / mother", sr: "mama / majka · мама / мајка" },
    { en: "dad / father", sr: "tata / otac · тата / отац" }, { en: "brother", sr: "brat · брат" },
    { en: "sister", sr: "sestra · сестра" }, { en: "son", sr: "sin · син" }, { en: "daughter", sr: "ćerka · ћерка" },
    { en: "husband", sr: "muž · муж" }, { en: "wife; woman", sr: "žena · жена" }, { en: "boyfriend", sr: "dečko · дечко" },
    { en: "girlfriend", sr: "devojka · девојка" }, { en: "male / female partner", sr: "partner / partnerka · партнер / партнерка" },
    { en: "Who is this?", sr: "Ko je ovo? · Ко је ово?" }, { en: "This is ...", sr: "Ovo je ... · Ово је ..." },
    { en: "my (with masculine / feminine noun)", sr: "moj / moja · мој / моја" },
    { en: "I have / don’t have ...", sr: "Imam / Nemam ... · Имам / Немам ..." }, { en: "love", sr: "ljubav · љубав" },
    { en: "her (with masculine / feminine noun)", sr: "njen / njena · њен / њена" }, { en: "photograph", sr: "fotografija · фотографија" },
    { en: "looks at", sr: "gleda · гледа" }, { en: "now", sr: "sada · сада" },
    { en: "old (with masculine / feminine noun)", sr: "star / stara · стар / стара" }
  ];
  const history = [Math.floor(Math.random() * cards.length)]; let position = 0; let serbian = false;
  const card = document.querySelector("#card"), text = document.querySelector("#text"), side = document.querySelector("#side"), status = document.querySelector("#status"), prev = document.querySelector("#prev"), next = document.querySelector("#next");
  function render() { const item = cards[history[position]]; side.textContent = serbian ? "Serbian" : "English"; text.textContent = serbian ? item.sr : item.en; status.textContent = `Seen ${position + 1} · ${cards.length} cards in this lesson`; prev.disabled = position === 0; card.setAttribute("aria-label", `Flash card, ${side.textContent} side. Tap to flip.`); }
  card.addEventListener("click", () => { serbian = !serbian; render(); }); prev.addEventListener("click", () => { if (position > 0) { position--; serbian = false; render(); } });
  next.addEventListener("click", () => { const recent = new Set(history.slice(Math.max(0, position - 9), position + 1)); const choices = cards.map((_, index) => index).filter(index => !recent.has(index)); const pick = choices[Math.floor(Math.random() * choices.length)]; history.splice(position + 1); history.push(pick); position++; serbian = false; render(); });
  document.addEventListener("keydown", event => { if (event.key === "ArrowLeft") prev.click(); if (event.key === "ArrowRight") next.click(); }); render();
</script></body></html>
